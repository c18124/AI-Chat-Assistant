<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#04182d">
    <title>AI Chat Assistant · 深海工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23072543'/%3E%3Cpath d='M11 37c7-8 14-8 21 0s14 8 21 0M11 24c7-8 14-8 21 0s14 8 21 0' fill='none' stroke='%239fe5ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="./static/css/style.css">
</head>

<body>
    <div class="ocean-background" aria-hidden="true">
        <div class="video-fallback"></div>
        <video
            id="ocean-video"
            class="ocean-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            poster="./images/background.png"
        >
            <source src="./static/videos/ocean.mp4" type="video/mp4">
        </video>
        <div class="background-overlay"></div>
        <div class="background-grain"></div>
        <div class="ambient-glow ambient-glow-one"></div>
        <div class="ambient-glow ambient-glow-two"></div>
    </div>

    <header class="topbar">
        <div class="brand" aria-label="AI Chat Assistant">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 14.5c2.6-2.8 5.2-2.8 7.8 0s5.2 2.8 7.8 0c.8-.9 1.6-1.4 2.4-1.7"/>
                    <path d="M3 9.5c2.6-2.8 5.2-2.8 7.8 0s5.2 2.8 7.8 0c.8-.9 1.6-1.4 2.4-1.7"/>
                </svg>
            </div>
            <div class="brand-copy">
                <span class="brand-name">AI CHAT ASSISTANT</span>
                <span class="brand-note">Ocean Intelligence</span>
            </div>
        </div>

        <div class="nav-actions">
            <div id="workspace-status" class="workspace-status" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">AI 工作台在线</span>
            </div>
            <button id="clear" class="icon-button" type="button" aria-label="清空聊天记录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 7h16"/>
                    <path d="M9 7V4h6v3"/>
                    <path d="M7 7l1 13h8l1-13"/>
                    <path d="M10 11v5M14 11v5"/>
                </svg>
                <span>清空记录</span>
            </button>
        </div>
    </header>

    <main class="workspace">
        <section class="workspace-intro" aria-labelledby="workspace-title">
            <div class="intro-copy">
                <p class="eyebrow">Immersive AI Workspace</p>
                <h1 id="workspace-title">DeepSea <span>AI Workspace</span></h1>
                <p class="intro-description">在流动海面与安静光影之间，继续你的智能对话、代码探索与知识库问答。</p>
            </div>
        </section>

        <section class="chat-panel" aria-label="AI 聊天工作台">
            <header class="panel-header">
                <div class="assistant-profile">
                    <div class="assistant-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a7 7 0 0 0-7 7v2a4 4 0 0 0 4 4h1"/>
                            <path d="M12 3a7 7 0 0 1 7 7v2a4 4 0 0 1-4 4h-1"/>
                            <path d="M9 20c1.8.9 4.2.9 6 0"/>
                            <path d="M9 10h.01M15 10h.01"/>
                        </svg>
                    </div>
                    <div class="assistant-copy">
                        <span class="assistant-name">DeepSea Assistant</span>
                        <span class="assistant-description">支持实时对话、Markdown 与知识库检索</span>
                    </div>
                </div>

                <div id="mode-area">
                    <label for="chat-mode">对话模式</label>
                    <div class="select-wrap">
                        <select id="chat-mode" aria-label="选择聊天模式">
                            <option value="normal">普通流式聊天</option>
                            <option value="rag">知识库问答 RAG</option>
                        </select>
                    </div>
                </div>
            </header>

            <div id="chat" role="log" aria-live="polite" aria-relevant="additions text">
                <div class="empty-state">
                    <div class="empty-state-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 15.5c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0"/>
                            <path d="M4 10.5c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0"/>
                            <path d="M9 5.5c1.8-1.3 3.8-1.3 6 0"/>
                        </svg>
                    </div>
                    <h2>开始一段新的探索</h2>
                    <p>输入问题与 AI 对话，或切换到 RAG 模式，从本地知识库中寻找更贴合项目内容的答案。</p>
                </div>
            </div>

            <footer class="composer">
                <div id="input-area">
                    <label class="sr-only" for="question">输入消息</label>
                    <input
                        id="question"
                        type="text"
                        maxlength="4000"
                        autocomplete="off"
                        placeholder="向 DeepSea Assistant 发送消息…"
                    >
                    <button id="send" type="button">
                        <span class="button-label">发送</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 3 10 14"/>
                            <path d="m21 3-7 18-4-7-7-4 18-7Z"/>
                        </svg>
                    </button>
                </div>
                <div class="composer-meta" aria-hidden="true">
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h.01M12 9h.01M16 9h.01M8 13h8"/></svg>
                        Enter 发送
                    </span>
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.8 2.8 8.1 7 10 4.2-1.9 7-5.2 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
                        对话历史保存至本地数据库
                    </span>
                </div>
            </footer>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./static/js/animation.js"></script>

    <script>
        "use strict";

        const API_BASE = "http://127.0.0.1:8000";
        const USER_ID = "001";

        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const sendButton = document.getElementById("send");
        const clearButton = document.getElementById("clear");
        const chatMode = document.getElementById("chat-mode");
        const statusElement = document.getElementById("workspace-status");
        const statusText = statusElement.querySelector(".status-text");

        marked.setOptions({
            gfm: true,
            breaks: true
        });

        function setStatus(text, isBusy = false) {
            statusText.textContent = text;
            statusElement.classList.toggle("is-busy", isBusy);
        }

        function setBusy(isBusy) {
            sendButton.disabled = isBusy;
            questionInput.disabled = isBusy;
            clearButton.disabled = isBusy;
            chatMode.disabled = isBusy;
            sendButton.querySelector(".button-label").textContent = isBusy ? "生成中" : "发送";
            setStatus(isBusy ? "AI 正在生成回答" : "AI 工作台在线", isBusy);
        }

        function showToast(message, type = "info") {
            const toast = document.createElement("div");
            toast.className = `toast${type === "error" ? " is-error" : ""}`;
            toast.setAttribute("role", "status");
            toast.textContent = message;
            document.body.appendChild(toast);

            window.setTimeout(() => {
                toast.remove();
            }, 2400);
        }

        function showEmptyState() {
            chat.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 15.5c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0"/>
                            <path d="M4 10.5c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0"/>
                            <path d="M9 5.5c1.8-1.3 3.8-1.3 6 0"/>
                        </svg>
                    </div>
                    <h2>开始一段新的探索</h2>
                    <p>输入问题与 AI 对话，或切换到 RAG 模式，从本地知识库中寻找更贴合项目内容的答案。</p>
                </div>
            `;
        }

        function hideEmptyState() {
            chat.querySelector(".empty-state")?.remove();
        }

        function scrollChatToBottom() {
            window.requestAnimationFrame(() => {
                chat.scrollTop = chat.scrollHeight;
            });
        }

        function renderMarkdown(container, content) {
            const parsed = marked.parse(content || "");
            container.innerHTML = DOMPurify.sanitize(parsed, {
                USE_PROFILES: { html: true }
            });

            container.querySelectorAll("pre code").forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function addMessage(content, role, options = {}) {
            hideEmptyState();

            const message = document.createElement("div");
            message.className = `message ${role}`;

            const contentElement = document.createElement("div");
            contentElement.className = "content";
            renderMarkdown(contentElement, content);

            const timeElement = document.createElement("span");
            timeElement.className = "time";
            timeElement.textContent = getCurrentTime();

            message.append(contentElement, timeElement);
            chat.appendChild(message);

            if (options.animate !== false) {
                window.oceanUI?.animateMessage(message);
            }

            scrollChatToBottom();
            return message;
        }

        function createLoadingMessage() {
            hideEmptyState();

            const loading = document.createElement("div");
            loading.className = "message ai is-loading";

            const contentElement = document.createElement("div");
            contentElement.className = "content loading-copy";
            contentElement.innerHTML = `
                <span class="thinking-orb" aria-hidden="true"></span>
                <span>AI 正在思考</span>
                <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            `;

            const timeElement = document.createElement("span");
            timeElement.className = "time";

            loading.append(contentElement, timeElement);
            chat.appendChild(loading);
            window.oceanUI?.animateMessage(loading);
            scrollChatToBottom();

            return {
                element: loading,
                contentElement,
                timeElement
            };
        }

        async function loadHistory() {
            setStatus("正在同步历史记录", true);

            try {
                const response = await fetch(`${API_BASE}/history/${USER_ID}`);

                if (!response.ok) {
                    throw new Error(`History request failed: ${response.status}`);
                }

                const data = await response.json();
                const messages = Array.isArray(data.messages) ? data.messages : [];

                if (messages.length === 0) {
                    showEmptyState();
                    return;
                }

                chat.innerHTML = "";
                for (const message of messages) {
                    addMessage(
                        message.content,
                        message.role === "user" ? "user" : "ai",
                        { animate: false }
                    );
                }
            } catch (error) {
                console.error("加载历史记录失败:", error);
                showEmptyState();
                showToast("历史记录暂时无法加载，请检查后端服务", "error");
            } finally {
                setStatus("AI 工作台在线");
            }
        }

        async function sendMessage() {
            const question = questionInput.value.trim();

            if (!question || sendButton.disabled) {
                return;
            }

            const useRag = chatMode.value === "rag";
            const endpoint = useRag ? `${API_BASE}/rag/chat` : `${API_BASE}/chat/stream`;
            const requestData = {
                user_id: USER_ID,
                question
            };

            setBusy(true);
            addMessage(question, "user");
            questionInput.value = "";

            const loading = createLoadingMessage();
            let answer = "";
            let requestCompleted = false;

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                loading.contentElement.classList.remove("loading-copy");

                if (useRag) {
                    const result = await response.json();
                    answer = result.answer || "";

                    if (!answer) {
                        throw new Error("RAG response is empty");
                    }

                    renderMarkdown(loading.contentElement, answer);
                    scrollChatToBottom();
                } else {
                    if (!response.body) {
                        throw new Error("Streaming response body is unavailable");
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");

                    while (true) {
                        const { done, value } = await reader.read();

                        if (done) {
                            answer += decoder.decode();
                            break;
                        }

                        const text = decoder.decode(value, { stream: true });
                        if (!text) {
                            continue;
                        }

                        answer += text;
                        renderMarkdown(loading.contentElement, answer);
                        scrollChatToBottom();
                    }

                    if (!answer) {
                        throw new Error("Streaming response is empty");
                    }
                }

                loading.timeElement.textContent = getCurrentTime();
                requestCompleted = true;
            } catch (error) {
                console.error("发送消息失败:", error);
                showToast("请求失败，请检查后端服务或网络连接", "error");

                if (!answer) {
                    loading.element.remove();
                    addMessage("服务器暂时无法完成请求，请稍后重试。", "ai");
                } else {
                    const interruption = document.createElement("p");
                    interruption.className = "stream-interrupted";
                    interruption.textContent = "⚠ 回答生成中断，请稍后重试。";
                    loading.contentElement.appendChild(interruption);
                    loading.timeElement.textContent = getCurrentTime();
                }
            } finally {
                if (!requestCompleted && !answer && loading.element.isConnected) {
                    loading.element.remove();
                }

                setBusy(false);
                questionInput.focus();
            }
        }

        async function clearHistory() {
            if (!window.confirm("是否清空全部聊天记录？此操作会删除当前用户的历史消息。")) {
                return;
            }

            clearButton.disabled = true;
            setStatus("正在清空聊天记录", true);

            try {
                const response = await fetch(`${API_BASE}/clear`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_id: USER_ID
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                showEmptyState();
                window.oceanUI?.animateClear(chat);
                showToast(result.message || "聊天记录已清空");
            } catch (error) {
                console.error("清空聊天记录失败:", error);
                showToast("服务器连接失败，聊天记录未清空", "error");
                addMessage("服务器暂时无法清空聊天记录，请稍后重试。", "ai");
            } finally {
                clearButton.disabled = false;
                setStatus("AI 工作台在线");
                questionInput.focus();
            }
        }

        questionInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener("click", sendMessage);
        clearButton.addEventListener("click", clearHistory);

        loadHistory();
    </script>
</body>
</html>
