services:
  app:
    build: .
    container_name: ai-chat-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./chat.db:/app/chat.db
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
